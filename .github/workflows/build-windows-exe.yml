name: Build Windows Desktop (.exe)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build AZK Desk Windows x64 (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web assets (Vite)
        run: npm run build

      - name: Package Windows .exe (NSIS + Portable)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run electron:build:win -- --publish never

      - name: Upload Windows .exe workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: azk-desk-windows-x64
          path: release/*.exe
          if-no-files-found: error

      - name: Publish .exe files to GitHub Release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
